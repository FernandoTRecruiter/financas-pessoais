/* A compra simulada junto com as parcelas que já existem, nos próximos 12 meses (a começar por
   este: a 1ª parcela pesa no mês da compra). Cada barra soma o que já está comprometido (taupe)
   e a parcela nova (argila clara). A linha tracejada é o "limite confortável" (30% da renda,
   ou o que você escolher). Por que mostrar o pior mês: é nele que a compra aperta. */
function graficoParcelas(p, n, aoMudar){
  const renda = S.config.renda || 0, pct = S.config.limitePct || 30, limite = Math.round(renda * pct / 100);
  const meses = [];
  for(let i = 0; i < 12; i++){
    const ym = addMeses(mesAtual(), i);
    meses.push({ym: ym, ex: parcelasDoMes(ym), nova: i < n ? p.parcela : 0});
  }
  const pior = Math.max.apply(null, meses.map(function(m){ return m.ex + m.nova; }));
  const escala = Math.max(pior, limite, 1) * 1.15;
  const barras = h('div', {'class': 'barras', id: 'parc-barras'}, meses.map(function(m){
    return h('div', {'class': 'barra-mes', 'data-ym': m.ym, 'data-existente': m.ex, 'data-nova': m.nova,
      title: mesCurto(m.ym) + ': ' + fmtDinheiro(m.ex + m.nova)},
      h('span', {'class': 'existente', style: 'height:' + (m.ex / escala * 100).toFixed(1) + '%'}),
      h('span', {'class': 'nova', style: 'height:' + (m.nova / escala * 100).toFixed(1) + '%'}));
  }));
  if(renda) barras.appendChild(h('div', {'class': 'limite-linha', style: 'bottom:' + (limite / escala * 100).toFixed(1) + '%'}));
  const frase = 'Com esta compra, seu pior mês fica em ' + fmtDinheiro(pior) +
    (renda ? ' (' + Math.round(pior / renda * 100) + '% da renda).' + (pior > limite ? ' Passa do limite confortável.' : '') : '. Informe a renda nos Ajustes para comparar.');
  const lim = h('input', {'class': 'entrada-txt num', id: 'parc-limite', type: 'text', inputmode: 'numeric', value: String(pct), 'aria-label': 'Limite confortável'});
  lim.addEventListener('change', function(){ S.config.limitePct = Math.max(1, Math.min(100, Math.round(calcNum(lim.value)) || 30)); save(); aoMudar(); });
  const nome = h('input', {'class': 'entrada-txt', id: 'parc-nome', type: 'text', value: PARC.nome || '', placeholder: 'Ex.: Sofá', 'aria-label': 'Nome da compra'});
  nome.addEventListener('input', function(){ PARC.nome = nome.value; });
  return h('div', {'class': 'grafico', id: 'parc-grafico'},
    barras,
    h('div', {'class': 'meses-rot', 'aria-hidden': 'true'}, meses.map(function(m){ return h('span', null, MESES[+m.ym.slice(5, 7) - 1].charAt(0).toUpperCase()); })),
    h('div', {'class': 'legenda'}, h('span', null, h('i', {style: 'background:var(--barra)'}), 'Parcelas atuais'),
      h('span', null, h('i', {style: 'background:var(--acc-claro)'}), 'Esta compra'), renda ? h('span', null, h('i', {'class': 'tracado'}), 'Limite confortável') : null),
    h('p', {'class': 'frase', id: 'parc-pior', 'data-pior': pior}, frase),
    h('div', {'class': 'campos'}, h('label', {'class': 'campo'}, 'Limite confortável (% da renda)', lim), h('label', {'class': 'campo'}, 'Nome da compra', nome)),
    h('div', {'class': 'acoes'}, h('button', {'class': 'botao primario cheio', type: 'button', id: 'parc-adicionar', onclick: function(){
      comDesfazer('Adicionada às suas parcelas', function(){
        S.parcelas.push({id: uid(), nome: (PARC.nome || '').trim() || 'Compra parcelada', v: p.parcela, n: n, inicio: mesAtual()});
      });
      PARC.nome = '';

/* Apagar tudo pede dois toques no mesmo botão (o primeiro só avisa), e ainda traz Desfazer.
   Por que não uma janela de confirmação: a do navegador é feia e trava a tela no celular. */
let apagarArmado = 0;
function apagarTudo(ev){
  const b = ev && ev.currentTarget;

/* ==================== importar extrato CSV ==================== */
/* Lê CSV com ; , ou tab (o separador é o que mais aparece na primeira linha, fora de aspas)
   e aspas duplas no padrão ("" dentro de aspas é uma aspa). Devolve as linhas não vazias. */
function parseCSV(text){
  text = String(text || '').replace(/^﻿/, '');
  const nl = text.indexOf('\n'), primeira = nl < 0 ? text : text.slice(0, nl);
  let delim = ';', melhor = -1;
  [';', ',', '\t'].forEach(function(d){
    let cnt = 0, q = false;
    for(let i = 0; i < primeira.length; i++){ const c = primeira[i]; if(c === '"') q = !q; else if(c === d && !q) cnt++; }
    if(cnt > melhor){ melhor = cnt; delim = d; }
  });
  const rows = [];
  let row = [], field = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i + 1] === '"'){ field += '"'; i++; } else q = false; } else field += c; }
    else if(c === '"') q = true;
    else if(c === delim){ row.push(field); field = ''; }
    else if(c === '\n'){ row.push(field.replace(/\r$/, '')); field = ''; rows.push(row); row = []; }
    else field += c;
  }
  if(field !== '' || row.length){ row.push(field.replace(/\r$/, '')); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); });
}
// a "identidade" de um lançamento para achar repetidos: data + descrição + valor
function chaveTx(t){ return t.d + '|' + normal(t.desc) + '|' + t.v; }
/* Alguns extratos trazem um resumo ANTES da tabela (saldo inicial e final). O cabeçalho é a
   primeira linha, entre as 10 primeiras, que tem uma coluna de data E uma de valor. */
function acharCabecalho(rows){
  for(let i = 0; i < Math.min(10, rows.length); i++){
    const cab = rows[i].map(function(c){ return String(c).toLowerCase(); });
    if(cab.some(function(c){ return /data|date/.test(c); }) && cab.some(function(c){ return /valor|montante|amount|quantia/.test(c); })) return i;
  }
  return 0;
}
/* Separa o que é novo do que já existe. A contagem por chave deixa entrar duas compras iguais
   no mesmo dia (dois cafés de R$ 5): só entra o que passa do que já está guardado. */
function separarNovos(cands){
  const exist = {}, usado = {}, novos = [];
  S.tx.forEach(function(t){ const k = chaveTx(t); exist[k] = (exist[k] || 0) + 1; });
  cands.forEach(function(c){
    const k = chaveTx(c);
    usado[k] = (usado[k] || 0) + 1;
    if(usado[k] > (exist[k] || 0)) novos.push(c);
  });
  return novos;
}
function abrirImportar(){
  const wz = {rows: [], mapa: {d: -1, desc: -1, v: -1}, sinal: 'neg'};
  const arq = h('input', {type: 'file', accept: '.csv,.txt,text/csv', id: 'imp-arquivo', 'class': 'entrada-txt', style: 'padding-top:12px'});
  const area = h('div');
  const btn = h('button', {'class': 'botao primario cheio', type: 'button', id: 'imp-confirmar', disabled: 'disabled'}, 'Escolha o arquivo');
  let novos = [], repetidos = 0;
  arq.addEventListener('change', function(){
    const f = arq.files && arq.files[0];
    if(!f) return;
    f.text().then(function(txt){ processar(parseCSV(txt)); }).catch(function(e){
      area.textContent = ''; area.appendChild(h('p', {'class': 'vazio'}, 'Não consegui ler o arquivo: ' + e.message));
    });
  });
  btn.addEventListener('click', importar);
  abrirFolha('Importar extrato', [
    h('p', {'class': 'sub', style: 'margin:8px 0 16px'}, 'Exporte o extrato em CSV no app do banco e escolha o arquivo. Repetir não duplica.'),
    arq, area, h('div', {'class': 'acoes'}, btn)]);

  // acha o cabeçalho, adivinha as colunas pelo nome (ou usa as que você escolheu da última vez)
  function processar(rows){
    const i = acharCabecalho(rows);
    wz.rows = rows.slice(i);
    if(wz.rows.length < 2){ area.textContent = ''; area.appendChild(h('p', {'class': 'vazio'}, 'Não achei linhas nesse arquivo.')); return; }
    const cab = wz.rows[0].map(function(c){ return String(c).toLowerCase(); });
    const salvo = (S.config.mapaCSV || {})[cab.join('|')];
    if(salvo){ wz.mapa = {d: salvo.d, desc: salvo.desc, v: salvo.v}; wz.sinal = salvo.sinal || 'neg'; }
    else {
      wz.mapa = {d: -1, desc: -1, v: -1};
      cab.forEach(function(c, k){
        if(wz.mapa.d < 0 && /data|date/.test(c)) wz.mapa.d = k;
        if(wz.mapa.desc < 0 && /descri|hist|detalh|estabelec|t[ií]tulo|nome|opera|transaction_type/.test(c)) wz.mapa.desc = k;
        if(wz.mapa.v < 0 && /valor|montante|amount|quantia/.test(c)) wz.mapa.v = k;
      });
    }
    desenhar();
  }
  function desenhar(){
    area.textContent = '';
    const nomes = wz.rows[0].map(function(n, k){ n = String(n).trim(); return n ? n.slice(0, 28) : 'coluna ' + (k + 1); });
    // cada escolha é uma fileira de chips: a coluna adivinhada já vem marcada; um toque troca
    const escolha = function(rotulo, opcoes, atual, aoEscolher){
      return h('div', {style: 'margin-top:16px'}, h('p', {'class': 'campo'}, rotulo), h('div', {'class': 'chips', style: 'margin-top:4px'},
        opcoes.map(function(o){ return h('button', {type: 'button', 'class': 'chip', 'aria-pressed': String(o[0] === atual),
          onclick: function(){ aoEscolher(o[0]); desenhar(); }}, o[1]); })));
    };
    const colunas = nomes.map(function(n, k){ return [k, n]; });
    area.append(
      escolha('Coluna da data', colunas, wz.mapa.d, function(k){ wz.mapa.d = k; }),
      escolha('Coluna da descrição', colunas, wz.mapa.desc, function(k){ wz.mapa.desc = k; }),
      escolha('Coluna do valor', colunas, wz.mapa.v, function(k){ wz.mapa.v = k; }),
      escolha('Sinal do valor', [['neg', 'Negativo é gasto'], ['todosGasto', 'Tudo é gasto'], ['inv', 'Inverter']], wz.sinal, function(v){ wz.sinal = v; }));
    // cada linha vira candidata; vale se tem data e valor diferente de zero
    const cands = wz.rows.slice(1).map(function(r){
      const d = wz.mapa.d >= 0 ? parseDateAny(r[wz.mapa.d]) : null;
      let v = wz.mapa.v >= 0 ? parseMoney(r[wz.mapa.v]) : null;
      if(v !== null && wz.sinal === 'todosGasto') v = -Math.abs(v); else if(v !== null && wz.sinal === 'inv') v = -v;
      return {ok: !!(d && v), d: d, desc: wz.mapa.desc >= 0 ? String(r[wz.mapa.desc] || '').trim() : '', v: v};
    });
    const validos = cands.filter(function(c){ return c.ok; }).map(function(c){ return {d: c.d, desc: c.desc, v: c.v}; });
    novos = separarNovos(validos);
    repetidos = validos.length - novos.length;

    })));
    area.appendChild(h('p', {'class': 'sub', id: 'imp-resumo', style: 'margin-top:16px'},
      plural(validos.length, 'linha válida', 'linhas válidas') + ', ' + plural(repetidos, 'já existia', 'já existiam') + '.'));
    btn.disabled = !novos.length;
    btn.textContent = novos.length ? 'Importar ' + plural(novos.length, 'lançamento', 'lançamentos') : 'Nada novo para importar';
  }
  function importar(){
    if(!novos.length) return;
    const n = novos.length, rep = repetidos;
    fecharFolha();
    comDesfazer(plural(n, 'lançamento importado', 'lançamentos importados') + (rep ? ', ' + rep + ' já existiam' : ''), function(){
      // categoriza um por um, na ordem, para "a mesma descrição de antes" valer dentro do próprio arquivo
      novos.forEach(function(c){
        S.tx.push({id: uid(), d: c.d, desc: c.desc, v: c.v, cat: sugerirCat(c.v > 0 ? 'e' : 'g', c.desc, true), org: 'csv'});
      });
      S.config.mapaCSV = S.config.mapaCSV || {};
      S.config.mapaCSV[wz.rows[0].map(function(c){ return String(c).toLowerCase(); }).join('|')] = {d: wz.mapa.d, desc: wz.mapa.desc, v: wz.mapa.v, sinal: wz.sinal};
    });
  }
}

/* ==================== exemplo (a Ana, pessoa fictícia) ==================== */
/* Por que existe: quem abre pela primeira vez vê tudo vazio e não entende o app. O exemplo
   gera 3 meses de lançamentos com números "aleatórios" de semente fixa: sai igual em toda
   máquina no mesmo dia, e o "Hoje dá para gastar" fica plausível em qualquer dia do mês. */
function geradorDemo(semente){
  let s = semente;
  return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}
function montarDemo(){
  const s = fresh(), rnd = geradorDemo(20261024);
  const entre = function(a, b){ return Math.round(a + rnd() * (b - a)); };   // centavos entre a e b
  s.config.demo = true;
  s.config.renda = 540000;   // R$ 5.400 líquidos
  s.config.jaLancou = true;   // a Ana já usa o app: a dica de primeiro uso não aparece
  // duas compras parceladas, simples: celular (faltam 4 de 10) e geladeira (faltam 7 de 12)
  s.parcelas.push({id: uid(), nome: 'Celular novo', v: 18900, n: 10, inicio: addMeses(mesAtual(), -6)},
    {id: uid(), nome: 'Geladeira', v: 24000, n: 12, inicio: addMeses(mesAtual(), -5)});
  [['Aluguel', 150000, 10], ['Condomínio', 38000, 10], ['Energia', 15000, 15], ['Internet', 9990, 12],
   ['Celular', 4990, 8], ['Academia', 11000, 5], ['Reserva', 40000, 6]].forEach(function(f){
    s.fixas.push({id: uid(), nome: f[0], v: f[1], dia: f[2]});
  });
  [['mercado', 90000], ['comida', 30000], ['transporte', 30000], ['lazer', 20000]].forEach(function(l){
    s.cats.find(function(c){ return c.id === l[0]; }).limite = l[1];
  });
  const ymHoje = mesAtual(), diaHoje = +hojeISO().slice(8, 10);
  const add = function(ym, dia, desc, v, cat){ s.tx.push({id: uid(), d: ym + '-' + pad2(dia), desc: desc, v: v, cat: cat, org: 'demo'}); };
  for(let i = 2; i >= 0; i--){
    const ym = addMeses(ymHoje, -i), atual = i === 0;
    const ultimo = atual ? diaHoje - 1 : diasNoMes(ym);          // no mês atual, o dia a dia vai até ontem
    const ate = function(d){ return !atual || d <= diaHoje; };   // entradas e contas: até hoje
    if(ate(5)) add(ym, 5, 'Salário', 540000, 'salario');
    if(ate(20)) add(ym, 20, 'Aulas de violão', 30000, 'extra');
    s.fixas.forEach(function(f){ if(ate(f.dia)) add(ym, f.dia, f.nome, -f.v, 'fixas'); });
    for(let d = 1; d <= ultimo; d++){
      if(rnd() < 0.55) add(ym, d, 'Padaria do bairro', -entre(900, 2400), 'cafe');
      if(d % 7 === 3) add(ym, d, 'Supermercado Bom Preço', -entre(16000, 26000), 'mercado');
      if(rnd() < 0.22) add(ym, d, 'iFood', -entre(3500, 8500), 'comida');
      if(rnd() < 0.35) add(ym, d, 'Uber', -entre(1400, 3200), 'transporte');
      if(rnd() < 0.08) add(ym, d, rnd() < 0.5 ? 'Cinema' : 'Bar com amigos', -entre(4000, 12000), 'lazer');
      if(rnd() < 0.05) add(ym, d, 'Farmácia', -entre(3000, 9000), 'saude');
      if(rnd() < 0.05) add(ym, d, 'Loja de roupas', -entre(6000, 18000), 'compras');
      if(rnd() < 0.04) add(ym, d, 'Utilidades para casa', -entre(2500, 8000), 'casa');
    }
  }
  // hoje cedo: um café e uma corrida, para a lista "Lançados hoje" não abrir vazia
  add(ymHoje, diaHoje, 'Padaria do bairro', -1250, 'cafe');
  add(ymHoje, diaHoje, 'Uber', -2340, 'transporte');
  s.fixas.forEach(function(f){ delete f.dia; });
  return s;
}
function entrarDemo(){
  const tema = S.config.tema;
  S = montarDemo(); S.config.tema = tema;
  if(PA.aberto){ fecharPrimeiro(); return; }
  PRIMEIRA_VEZ = false;

function apagarDemo(){

/* ==================== minhas parcelas ==================== */
/* Uma parcela guardada: {id, nome, v (valor de cada parcela, centavos), n (quantas no total),
   inicio ("aaaa-mm" da 1ª)}. A k-ésima cai no mês inicio + k - 1. Por que guardar o início e não
   "quantas faltam": o "faltam" muda sozinho a cada mês; o início não, então nada precisa ser
   atualizado à mão. As parcelas abertas no mês entram junto com as contas fixas. */
function mesesEntre(a, b){ return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); }
function parcelaNoMes(p, ym){ const k = mesesEntre(p.inicio, ym); return k >= 0 && k < p.n; }
// quanto as parcelas tomam de um mês (as guardadas, ou uma lista de teste)
function parcelasDoMes(ym, lista){ return (lista || S.parcelas).reduce(function(a, p){ return parcelaNoMes(p, ym) ? a + p.v : a; }, 0); }
// quantas faltam pagar, contando a deste mês
function faltam(p){ return Math.max(0, Math.min(p.n, p.n - mesesEntre(p.inicio, mesAtual()))); }
function mesCurto(ym){ return MESES[+ym.slice(5, 7) - 1].slice(0, 3) + '/' + ym.slice(2, 4); }
function descParcela(p){ const f = faltam(p); return f ? 'Faltam ' + f + ' de ' + p.n + ' · desde ' + mesCurto(p.inicio) : 'Quitada'; }
// de "quantas no total" e "quantas faltam" sai o mês da primeira
function inicioDe(n, f){ return addMeses(mesAtual(), -(n - f)); }

/* ==================== marca ==================== */
/* A marca do Vintém: uma moeda (o círculo) com o V. Desenho geométrico de dois traços, que
   continua legível em 16 px (o ícone da aba é o mesmo desenho). As cores saem do tema. */
function marca(tam){
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 32 32'); s.setAttribute('width', tam); s.setAttribute('height', tam);
  s.setAttribute('aria-hidden', 'true'); s.setAttribute('class', 'marca');
  s.innerHTML = '<circle class="marca-c" cx="16" cy="16" r="15"/><path class="marca-v" d="M10.5 10.5 16 22l5.5-11.5" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>';
  return s;
}

   pular é começar do zero. Tudo pode ser mudado depois nos Ajustes. Por que perguntar antes:

/* ==================== navegação, tema e começo ==================== */
// [id, rótulo na barra, ícone]. Hoje no centro, onde o polegar alcança melhor; "Calcular" porque
// "Calculadoras" não cabe em 5 colunas a 390 px. O app continua abrindo em Hoje.
const TELAS = [['hist', 'Histórico', 'hist'], ['mes', 'Mês', 'mes'], ['hoje', 'Hoje', 'hoje'], ['calc', 'Calcular', 'calc'], ['ajustes', 'Ajustes', 'ajustes']];
let telaAtual = 'hoje';
function mostrarTela(id){
  if(!TELAS.some(function(t){ return t[0] === id; })) id = 'hoje';
  if(id === 'mes' && telaAtual !== 'mes') mesVer = mesAtual();
  telaAtual = id;
  TELAS.forEach(function(t){ document.getElementById('tela-' + t[0]).hidden = t[0] !== id; });
  document.querySelectorAll('#nav a').forEach(function(a){
    if(a.dataset.tela === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  render();
  window.scrollTo(0, 0);
}
// redesenha só a tela aberta (as outras se desenham quando forem abertas) e o que é comum
function render(){
  if(telaAtual === 'hoje') renderHoje();
  else if(telaAtual === 'mes') renderMes();
  else if(telaAtual === 'hist') renderHist();
  else if(telaAtual === 'calc') renderCalc();

function irPara(id){ if(location.hash === '#' + id) mostrarTela(id); else location.hash = '#' + id; }

// ?tema=claro|escuro na URL manda (fotos e testes); senão vale a escolha salva; "auto" segue o sistema
function aplicarTema(ignorarUrl){
  let t = null;
  if(!ignorarUrl){ try{ t = new URLSearchParams(location.search).get('tema'); }catch(_){} }
  t = t || S.config.tema || 'auto';
  if(t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
  document.documentElement.dataset.theme = t === 'escuro' ? 'dark' : 'light';
  document.querySelector('meta[name="theme-color"]').content = t === 'escuro' ? '#1C1713' : '#FAF6F0';
}
// teclado físico (computador): na tela Hoje digita o valor; na calculadora faz a conta
function teclaFisica(ev){
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName) || document.getElementById('folha').open || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if(PA.aberto){
    const k = /^[0-9]$/.test(ev.key) ? ev.key : {',': ',', '.': ',', 'Backspace': 'del', 'Enter': 'ok'}[ev.key];
    if(PA.passo === 2 && k){ ev.preventDefault(); teclaPrimeiro(k); }
    return;
  }
  if(telaAtual === 'hoje'){
    const k = /^[0-9]$/.test(ev.key) ? ev.key : {',': ',', '.': ',', 'Backspace': 'del', 'Enter': 'ok'}[ev.key];
    if(!k) return;
    ev.preventDefault(); tecla(k);
  } else if(telaAtual === 'calc' && calcAba === 'comum'){
    const mapa = {',': ',', '.': ',', '+': '+', '-': '−', '*': '×', 'x': '×', '/': '÷', 'Enter': '=', '=': '=', '%': '%',
      'Backspace': '⌫', 'Escape': 'C', 'Delete': 'C'};
    const k = /^[0-9]$/.test(ev.key) ? ev.key : mapa[ev.key];
    if(!k) return;
    ev.preventDefault(); calcTecla(k); calcMostra();
  }
}

function init(){
  load();
  aplicarTema();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ aplicarTema(); });
  matchMedia('(min-width: 1100px)').addEventListener('change', renderLateral);
  const nav = document.getElementById('nav');
  TELAS.forEach(function(t){ nav.appendChild(h('a', {href: '#' + t[0], 'data-tela': t[0], 'class': t[0] === 'hoje' ? 'centro' : null}, icone(t[2], 22), t[1])); });
  window.addEventListener('hashchange', function(){ mostrarTela(location.hash.slice(1)); });
  document.getElementById('apagar-demo').addEventListener('click', apagarDemo);
  document.addEventListener('keydown', teclaFisica);
  document.addEventListener('touchstart', function(){}, {passive: true});   // liga o :active no iPhone
  // tocar no fundo escuro fecha a folha (o toque dentro dela cai num filho, não no dialog)
  const dlg = document.getElementById('folha');
  dlg.addEventListener('click', function(ev){ if(ev.target === dlg && !PRIMEIRA_VEZ) dlg.close(); });
  dlg.addEventListener('cancel', function(ev){ if(PRIMEIRA_VEZ) ev.preventDefault(); });
  mostrarTela(location.hash.slice(1) || 'hoje');
  if(PRIMEIRA_VEZ && PODE_SALVAR) abrirPrimeiro();
  document.body.dataset.ready = '1';
}
init();
</script>
